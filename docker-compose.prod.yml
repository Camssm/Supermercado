services:
  mysql-db:
    image: mysql:8.0
    container_name: mysql-supermercado
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: supermercado_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - supermercado-network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq-supermercado
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - supermercado-network

  eurekaserver:
    build:
      context: .
      dockerfile: registry/Dockerfile
    container_name: eurekaserver
    ports:
      - "8761:8761"
    networks:
      - supermercado-network

  configserver:
    build:
      context: .
      dockerfile: springconfigserver/dockerfile
    container_name: configserver
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eurekaserver:8761/eureka/
    ports:
      - "8888:8888"
    depends_on:
      - eurekaserver
    networks:
      - supermercado-network

  ms-usuario:
    build:
      context: .
      dockerfile: Usuario/Dockerfile
    container_name: ms-usuario
    restart: on-failure
    environment:
      SPRING_PROFILES_ACTIVE: prod
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eurekaserver:8761/eureka/
      EUREKA_INSTANCE_PREFER_IPADDRESS: "true"
      CONFIG_SERVER_URL: http://configserver:8888
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/supermercado_db?useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      GATEWAY_INTERNAL_SECRET: ${GATEWAY_INTERNAL_SECRET:-supermercado-gateway-secret}
    depends_on:
      mysql-db:
        condition: service_healthy
      eurekaserver:
        condition: service_started
      configserver:
        condition: service_started
    ports:
      - "8083:8083"
    networks:
      - supermercado-network

  ms-security:
    build:
      context: .
      dockerfile: security-service/Dockerfile
    container_name: ms-security
    restart: on-failure
    environment:
      SPRING_PROFILES_ACTIVE: prod
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eurekaserver:8761/eureka/
      EUREKA_INSTANCE_PREFER_IPADDRESS: "true"
      CONFIG_SERVER_URL: http://configserver:8888
      USUARIO_URL: http://ms-usuario:8083
      JWT_SECRET: ${JWT_SECRET:-c3VwZXJtZXJjYWRvLWp3dC1zZWNyZXQtZGV2LTMyYiE=}
      GATEWAY_INTERNAL_SECRET: ${GATEWAY_INTERNAL_SECRET:-supermercado-gateway-secret}
    depends_on:
      eurekaserver:
        condition: service_started
      configserver:
        condition: service_started
    ports:
      - "8085:8085"
    networks:
      - supermercado-network

  ms-productos:
    build:
      context: .
      dockerfile: Productos/Dockerfile
    container_name: ms-productos
    restart: on-failure
    environment:
      SPRING_PROFILES_ACTIVE: prod
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eurekaserver:8761/eureka/
      EUREKA_INSTANCE_PREFER_IPADDRESS: "true"
      CONFIG_SERVER_URL: http://configserver:8888
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/supermercado_db?useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_RABBITMQ_HOST: rabbitmq
      GATEWAY_INTERNAL_SECRET: ${GATEWAY_INTERNAL_SECRET:-supermercado-gateway-secret}
    depends_on:
      mysql-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      eurekaserver:
        condition: service_started
      configserver:
        condition: service_started
    ports:
      - "8081:8081"
    networks:
      - supermercado-network

  ms-facturacion:
    build:
      context: .
      dockerfile: Facturacion/Dockerfile
    container_name: ms-facturacion
    restart: on-failure
    environment:
      SPRING_PROFILES_ACTIVE: prod
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eurekaserver:8761/eureka/
      EUREKA_INSTANCE_PREFER_IPADDRESS: "true"
      CONFIG_SERVER_URL: http://configserver:8888
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/supermercado_db?useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_RABBITMQ_HOST: rabbitmq
      GATEWAY_INTERNAL_SECRET: ${GATEWAY_INTERNAL_SECRET:-supermercado-gateway-secret}
    depends_on:
      mysql-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      eurekaserver:
        condition: service_started
      configserver:
        condition: service_started
    ports:
      - "8082:8082"
    networks:
      - supermercado-network

  gateway:
    build:
      context: .
      dockerfile: gateway/dockerfile
    container_name: gateway
    restart: on-failure
    environment:
      CORS_ALLOWED_ORIGIN: ${CORS_ALLOWED_ORIGIN:-http://localhost:4200}
      SPRING_PROFILES_ACTIVE: prod
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eurekaserver:8761/eureka/
      EUREKA_INSTANCE_PREFER_IPADDRESS: "true"
      CONFIG_SERVER_URL: http://configserver:8888
      JWT_SECRET: ${JWT_SECRET:-c3VwZXJtZXJjYWRvLWp3dC1zZWNyZXQtZGV2LTMyYiE=}
      GATEWAY_INTERNAL_SECRET: ${GATEWAY_INTERNAL_SECRET:-supermercado-gateway-secret}
    depends_on:
      eurekaserver:
        condition: service_started
      configserver:
        condition: service_started
      ms-security:
        condition: service_started
      ms-usuario:
        condition: service_started
      ms-productos:
        condition: service_started
      ms-facturacion:
        condition: service_started
    ports:
      - "8080:8080"
    networks:
      - supermercado-network

  admin-service:
    build:
      context: .
      dockerfile: admin-service/Dockerfile
    container_name: admin-service
    restart: on-failure
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eurekaserver:8761/eureka/
    ports:
      - "9090:9090"
    depends_on:
      - eurekaserver
    networks:
      - supermercado-network

  frontend:
    build:
      context: https://github.com/sabriAla/Supermercado-Angular.git#main
    container_name: frontend-supermercado
    ports:
      - "4200:80"
    depends_on:
      - gateway
    networks:
      - supermercado-network

volumes:
  mysql_data:

networks:
  supermercado-network:
    driver: bridge
